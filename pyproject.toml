[tool.poetry]
name = "pychestrate-core"
description = "Code Craft AI - Pychestrate - Core"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.30"
sqlalchemy-utils = ">=0.41.2,<0.43.0"
codecraftai-foundations = ">=1.0.0,<2.0.0"
codecraftai-configuration = ">=1.0.0,<2.0.0"
codecraftai-runtime = ">=1.0.0,<2.0.0"
codecraftai-credentials = ">=1.0.0,<2.0.0"
codecraftai-dataprofiles = ">=1.0.0,<2.0.0"
codecraftai-testbase = ">=1.0.0,<2.0.0"



[tool.poetry.group.dev.dependencies]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
