[tool.poetry]
name = "pychestrate-core"
description = "Automation Mojo - Pychestrate - Core"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.30"
sqlalchemy-utils = "^0.41.2"
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-runtime = { git = "https://github.com/automationmojo/automojo-runtime.git", branch = "main" }
automojo-credentials = { git = "https://github.com/automationmojo/automojo-credentials.git", branch = "main" }
automojo-dataprofiles = { git = "https://github.com/automationmojo/automojo-dataprofiles.git", branch = "main" }
automojo-testbase = { git = "https://github.com/automationmojo/automojo-testbase.git", branch = "main" }



[tool.poetry.group.dev.dependencies]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
