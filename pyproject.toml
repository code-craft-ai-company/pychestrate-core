[tool.poetry]
name = "pychestrate-core"
description = "Pychestrate - Core"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.30"
sqlalchemy-utils = "^0.41.2"
automojo-errors = { git = "git@github.com:automationmojo/automojo-errors.git", branch = "main" }
automojo-credentials = { git = "git@github.com:automationmojo/automojo-credentials.git", branch = "main" }
automojo-dataprofiles = { git = "git@github.com:automationmojo/automojo-dataprofiles.git", branch = "main" }
pyyaml = "^6.0.2"


[tool.poetry.group.dev.dependencies]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
