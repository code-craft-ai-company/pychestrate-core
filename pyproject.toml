[tool.poetry]
name = "pychestrate-core"
description = "Code Craft AI - Pychestrate - Core"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.30"
sqlalchemy-utils = ">=0.41.2,<0.43.0"
codecraftai-foundations = { version = "<2.0.0", source = "codecraftai" }
codecraftai-configuration = { version = "<2.0.0", source = "codecraftai" }
codecraftai-runtime = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-dataprofiles = { version = "<2.0.0", source = "codecraftai" }
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }



[tool.poetry.group.dev.dependencies]


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
